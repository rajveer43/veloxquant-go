name: Record traffic stats

on:
  schedule:
    # GitHub's traffic API only retains 14 days of history, so this needs
    # to run at least that often to avoid gaps.
    - cron: "0 6 * * 1" # every Monday 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Snapshot clone/view traffic
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .github/scripts/record_traffic.sh

      - name: Commit updated history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- traffic-history.json; then
            echo "No traffic changes to commit"
            exit 0
          fi
          git add traffic-history.json
          git commit -m "chore: record weekly traffic stats"
          git push
