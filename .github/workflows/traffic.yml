name: Record traffic stats

on:
  schedule:
    # GitHub's traffic API only retains 14 days of history, so this needs
    # to run at least that often to avoid gaps.
    - cron: "0 6 * * 1" # every Monday 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Snapshot clone/view traffic
        env:
          # The traffic/clones and traffic/views endpoints reject the
          # built-in GITHUB_TOKEN outright (HTTP 403 "Resource not
          # accessible by integration") regardless of the permissions
          # granted above; they require a personal access token from a
          # user with push access to the repo.
          GH_TOKEN: ${{ secrets.TRAFFIC_PAT }}
        run: .github/scripts/record_traffic.sh

      - name: Commit updated history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add traffic-history.json
          if git diff --cached --quiet -- traffic-history.json; then
            echo "No traffic changes to commit"
            exit 0
          fi
          git commit -m "chore: record weekly traffic stats"
          git push
